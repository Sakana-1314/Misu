name: 清理旧镜像

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    name: 删除旧镜像包
    runs-on: ubuntu-latest
    steps:
      - name: 删除 misu-server 全部版本
        uses: actions/delete-package-versions@v5
        with:
          package-name: misu-server
          package-type: container
          min-versions-to-keep: 0

      - name: 将 misu-web 设为私有
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"visibility":"private"}' \
            -w "\nHTTP %{http_code}\n" \
            https://api.github.com/user/packages/container/misu-web

      - name: 删除 misu-web 全部版本
        uses: actions/delete-package-versions@v5
        with:
          package-name: misu-web
          package-type: container
          min-versions-to-keep: 0

      - name: 删除 misu-web 包本身
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -w "\nHTTP %{http_code}\n" \
            https://api.github.com/user/packages/container/misu-web
